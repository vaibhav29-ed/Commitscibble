<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CommitScibble — The AI agent that works with your codebase</title>
    <meta
      name="description"
      content="CommitScibble connects to your GitHub repositories, generates README documentation from real source code, and updates only the sections affected by each push."
    />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=DM+Sans:opsz,wght@9..40,300..800&family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("cs-theme");
          var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = stored === "dark" || (stored === "system" && systemDark);
          if (dark) document.documentElement.classList.add("dark");
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        } catch (error) {
        }
      })();
    </script>
  </head>
  <body class="h-full bg-background text-foreground antialiased">
    <div id="root" class="min-h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
