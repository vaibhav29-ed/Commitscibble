<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CommitScibble — Your code evolves. Your docs follow.</title>
    <meta
      name="description"
      content="CommitScibble connects to your GitHub repositories, generates README documentation from real source code, and updates only the sections affected by each push."
    />
    <meta name="theme-color" content="#09090b" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f172a'/%3E%3Cpath d='M9 11h9l5 5v5H9z' fill='none' stroke='%236ee7b7' stroke-width='2'/%3E%3Cpath d='M12 16h6M12 19h4' stroke='%23e4e4e7' stroke-width='1.6'/%3E%3C/svg%3E" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("cs-theme");
          var dark =
            stored === "dark" ||
            (!stored && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (error) {
          /* theme preference is optional */
        }
      })();
    </script>
  </head>
  <body class="h-full bg-background text-foreground antialiased">
    <div id="root" class="min-h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
