# Render blueprint for the API, background worker and managed Redis.
# MongoDB Atlas, Convex and the Vercel frontend are configured separately
# (see docs/deployment.md). Secrets live in the `commitscibble-secrets`
# environment group and are never committed.
services:
  - type: redis
    name: commitscibble-redis
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: commitscibble-api
    runtime: node
    plan: starter
    region: oregon
    healthCheckPath: /ready
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter "./packages/**" build && pnpm --filter @commitscibble/api build
    startCommand: node services/api/dist/server.js
    envVars:
      - key: NODE_VERSION
        value: 20.18.1
      - key: NODE_ENV
        value: production
      - fromGroup: commitscibble-secrets

  - type: worker
    name: commitscibble-worker
    runtime: node
    plan: starter
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter "./packages/**" build && pnpm --filter @commitscibble/worker build
    startCommand: node services/worker/dist/index.js
    envVars:
      - key: NODE_VERSION
        value: 20.18.1
      - key: NODE_ENV
        value: production
      - fromGroup: commitscibble-secrets
